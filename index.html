<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flat Duty Roster – Winter</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:rgba(255,247,251,.6);--card:rgba(255,255,255,.72);--tx:#2b1b34;--mut:#6d5a78;--ac:#e0479e;--ac2:#7c4dff;--ok:#1fb67a;--bad:#ef4444;--line:rgba(240,223,233,.8)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:rgba(21,13,28,.55);--card:rgba(34,21,48,.68);--tx:#f5eafa;--mut:#c0aed0;--line:rgba(80,55,110,.7)}}
:root[data-theme=dark]{--bg:rgba(21,13,28,.55);--card:rgba(34,21,48,.68);--tx:#f5eafa;--mut:#c0aed0;--line:rgba(80,55,110,.7)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#0b1630;color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 2.2s;z-index:0}
.bg.on{opacity:1;animation:kb 16s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.12) translate(-1.5%,-1%)}}
.sf{position:fixed;top:-20px;z-index:2;color:#fff;pointer-events:none;text-shadow:0 0 6px #fff;animation:fall linear infinite}
@keyframes fall{to{transform:translate(40px,108vh) rotate(360deg)}}
.gar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:8;display:flex;justify-content:space-around;pointer-events:none;height:14px;border-top:2px solid #1d3b2a}
.gar i{width:8px;height:12px;border-radius:50%;margin-top:2px;animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25;transform:scale(.8)}to{opacity:1;transform:scale(1.15);box-shadow:0 0 10px currentColor}}
.wrap{position:relative;z-index:3;max-width:760px;margin:0 auto;padding:26px 16px 16px}
h1{margin:6px 0 2px;font-size:30px;background:linear-gradient(90deg,#ff6b81,#fff,#7cf0b4,#ff6b81);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite;filter:drop-shadow(0 2px 5px #0008)}
@keyframes sh{to{background-position:200%}}
.sub{color:var(--mut);margin:0 0 12px}
.wrap>.sub,.head h2,.head .sub,.sec,.note,.empty,#menu .sub{color:#fff;text-shadow:0 1px 6px #000c}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);backdrop-filter:blur(8px);color:var(--tx);padding:7px 13px;border-radius:99px;cursor:pointer;font:inherit;transition:.25s}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:linear-gradient(135deg,#d6284f,#1f9d62);color:#fff;border-color:transparent;box-shadow:0 6px 16px #d6284f66}
.days{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 14px;scroll-snap-type:x proximity}
.day{flex:0 0 auto;width:58px;padding:8px 0;text-align:center;border-radius:16px;background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);cursor:pointer;scroll-snap-align:center;transition:.25s;color:var(--tx);font:inherit}
.day small{display:block;color:var(--mut);font-size:11px}.day b{font-size:19px}
.day.today{border-color:var(--ac);box-shadow:0 0 12px var(--ac)}
.day.on{background:linear-gradient(160deg,#d6284f,#1f9d62);color:#fff;transform:scale(1.08)}
.day.on small{color:#ffe}
.dot{display:block;width:6px;height:6px;border-radius:50%;margin:3px auto 0;background:var(--ok);opacity:0}.day.me .dot{opacity:1}
.head{display:flex;justify-content:space-between;align-items:end;margin:4px 0 8px}
.head h2{margin:0;font-size:21px}
.bar{height:8px;background:rgba(255,255,255,.35);border-radius:9px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),#6ee7b7);transition:width .7s cubic-bezier(.2,.9,.3,1.2)}
.card{display:flex;align-items:center;gap:12px;background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:10px;opacity:0;animation:in .5s forwards;transition:.3s}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.card.mine{border-color:var(--ac);box-shadow:0 8px 22px #e0479e44}
.card.done{opacity:.8!important}
.card.late{border-color:var(--bad);animation:in .5s forwards,pu 1.6s 1s infinite}
@keyframes pu{50%{box-shadow:0 0 0 5px #ef444433}}
.ic{font-size:30px;width:48px;height:48px;display:grid;place-items:center;background:var(--bg);border-radius:14px;animation:wob 3s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-8deg) scale(1.08)}}
.inf{flex:1;min-width:0}.inf b{display:block}.inf span{color:var(--mut);font-size:14px}
.who{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--bg);color:var(--ac);font-weight:600;font-size:14px}
.by{color:var(--ok)!important;font-weight:600}
.st{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;border:2px dashed var(--line);color:var(--mut);background:none;font-family:inherit}
.st.ok{background:var(--ok);border:0;color:#fff;animation:pop .5s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.35)}100%{transform:scale(1)}}
button.st{cursor:pointer}button.st:hover{transform:scale(1.12)}
.sp{position:fixed;z-index:20;pointer-events:none;font-size:20px;animation:sp .9s ease-out forwards}
@keyframes sp{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}
select,input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px;max-width:100%}
.adm{display:none;background:var(--card);backdrop-filter:blur(8px);border:1px dashed var(--ac2);border-radius:18px;padding:14px;margin:14px 0;animation:in .4s forwards}
.adm.show{display:block}
.adm h3{margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.grid label{font-size:12px;color:var(--mut);display:block}
.toast{position:fixed;left:50%;top:calc(24px + env(safe-area-inset-top,0px));transform:translate(-50%,-200%);background:linear-gradient(135deg,#d6284f,#1f9d62);color:#fff;padding:12px 18px;border-radius:16px;z-index:30;transition:.5s;box-shadow:0 10px 30px #0004;max-width:92%}
.toast.show{transform:translate(-50%,0)}
.note{font-size:13px;margin-top:16px;text-align:center}
.empty{text-align:center;padding:30px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1}.bg.on{opacity:1}.sf{display:none}}
.sec{margin:14px 0 8px;font-weight:700}.fd{animation:in .5s forwards;opacity:0}.big{animation:pop .5s}

/* bigger + brighter text */
body{font-size:18px;font-weight:500}
:root{--card:rgba(255,255,255,.86);--tx:#150820;--mut:#3f2a50;--bg:rgba(255,240,248,.9)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--card:rgba(28,16,44,.82);--tx:#fff;--mut:#eadcf6;--bg:rgba(60,35,90,.85)}}
:root[data-theme=dark]{--card:rgba(28,16,44,.82);--tx:#fff;--mut:#eadcf6;--bg:rgba(60,35,90,.85)}
h1{font-size:42px;font-weight:900;letter-spacing:.5px;filter:drop-shadow(0 2px 6px #000) drop-shadow(0 0 12px #fff6)}
.wrap>.sub,.head .sub,.note,.empty,#menu .sub{font-size:18px;font-weight:700;color:#fff;text-shadow:0 2px 8px #000,0 0 3px #000}
.head h2{font-size:28px;font-weight:900;color:#fff;text-shadow:0 2px 10px #000,0 0 4px #000}
.sec{font-size:21px;font-weight:800;color:#fff;text-shadow:0 2px 10px #000,0 0 4px #000}
.chip{font-size:17px;font-weight:700;padding:9px 16px;color:var(--tx)}
.chip.on{color:#fff;text-shadow:0 1px 3px #0006}
.day{width:66px;padding:10px 0}.day small{font-size:13px;font-weight:700;color:var(--mut)}.day b{font-size:25px;font-weight:900}
.day.on small{color:#fff}
.inf b{font-size:22px;font-weight:900;color:var(--tx)}
.inf span{font-size:16px;font-weight:600;color:var(--mut)}
.who{font-size:17px;font-weight:800;padding:3px 12px;color:#d1136f;background:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .who{color:#ff7ac2;background:rgba(255,255,255,.12)}}
.by{font-size:16px!important;font-weight:800!important;color:#058a52!important}
.ic{width:58px;height:58px;font-size:36px}
.st{width:50px;height:50px;font-size:28px;font-weight:900;border-color:var(--mut);color:var(--tx)}
.card{padding:15px;border-width:2px}
select,input,textarea{font-size:16px}
.toast{font-size:18px;font-weight:700}

/* v3: wide layout, bigger text, fir-tree light glow, splash */
.wrap{max-width:1500px;width:100%;padding:34px 3.5vw 24px}
body{font-size:21px}
#list,#menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
#list .sec,#list .empty{grid-column:1/-1}
#list .card,#menu .card{margin:0}
h1{font-size:clamp(44px,7vw,84px);animation:sh 6s linear infinite,glowf 4s linear infinite}
.wrap>.sub,.head .sub,.note,.empty,#menu .sub{font-size:21px}
.head h2{font-size:clamp(30px,4vw,44px)}
.sec{font-size:clamp(24px,3vw,32px)}
.chip{font-size:20px;padding:11px 20px}
.day{width:84px;padding:12px 0;border-radius:20px}.day small{font-size:15px}.day b{font-size:32px}
.inf b{font-size:28px}
.inf span{font-size:19px}
.who{font-size:21px;padding:4px 14px}.by{font-size:19px!important}
.ic{width:72px;height:72px;font-size:46px;border-radius:18px}
.st{width:62px;height:62px;font-size:34px}
.card{padding:20px;border-radius:24px;gap:16px}
select,input,textarea{font-size:18px}
#pick{font-size:28px!important}
@keyframes glow{0%,100%{text-shadow:0 2px 3px #000,0 0 8px #ff4d6d,0 0 18px #ff4d6d,0 0 32px #ff2d55}25%{text-shadow:0 2px 3px #000,0 0 8px #ffd24d,0 0 18px #ffd24d,0 0 32px #ffb300}50%{text-shadow:0 2px 3px #000,0 0 8px #4dff9d,0 0 18px #4dff9d,0 0 32px #00e676}75%{text-shadow:0 2px 3px #000,0 0 8px #4dc3ff,0 0 18px #4dc3ff,0 0 32px #0091ff}}
@keyframes glowc{0%,100%{text-shadow:0 0 6px #ff4d6d99,0 0 14px #ff4d6d77}25%{text-shadow:0 0 6px #ffb300aa,0 0 14px #ffd24d88}50%{text-shadow:0 0 6px #00e676aa,0 0 14px #4dff9d88}75%{text-shadow:0 0 6px #0091ffaa,0 0 14px #4dc3ff88}}
@keyframes glowf{0%,100%{filter:drop-shadow(0 0 10px #ff4d6d) drop-shadow(0 2px 4px #000)}25%{filter:drop-shadow(0 0 10px #ffd24d) drop-shadow(0 2px 4px #000)}50%{filter:drop-shadow(0 0 10px #4dff9d) drop-shadow(0 2px 4px #000)}75%{filter:drop-shadow(0 0 10px #4dc3ff) drop-shadow(0 2px 4px #000)}}
.wrap>.sub,.head h2,.head .sub,.sec,.note,#menu .sub,#pick,.empty{animation:glow 4s linear infinite}
.sec{animation-delay:-1s}.head .sub{animation-delay:-2s}.note{animation-delay:-3s}
.inf b,.day b,.chip.on{animation:glowc 4s linear infinite}
.card:nth-child(2n) .inf b{animation-delay:-1s}.card:nth-child(3n) .inf b{animation-delay:-2s}.day:nth-child(2n) b{animation-delay:-1.5s}
#sp{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(2,8,24,.5);backdrop-filter:blur(5px);overflow:auto;cursor:pointer;animation:sfade .6s}
@keyframes sfade{from{opacity:0}}
#sp.out{animation:sout .8s forwards;pointer-events:none}
@keyframes sout{to{opacity:0;transform:scale(1.5);visibility:hidden}}
.spin{max-width:1200px;width:100%;margin:auto;text-align:center;animation:loom 1.5s cubic-bezier(.2,.9,.25,1.1) both}
@keyframes loom{from{transform:scale(.15);opacity:0;filter:blur(14px)}to{transform:none;opacity:1;filter:none}}
#sp h2{font-size:clamp(34px,7vw,78px);margin:0;color:#fff;font-weight:900;animation:glow 4s linear infinite}
.sd{font-size:clamp(20px,3vw,32px);color:#fff;font-weight:800;margin:6px 0 0;text-shadow:0 2px 8px #000}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;margin:28px 0}
.sc{background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.65);border-radius:26px;padding:22px 16px;color:#fff;backdrop-filter:blur(6px);animation:loom .9s cubic-bezier(.2,.9,.25,1.1) both;animation-delay:calc(.5s + var(--i)*.15s)}
.sc.me{border-color:#ffd24d;box-shadow:0 0 28px #ffd24d99}
.sc .e{font-size:62px;display:block;animation:wob 3s ease-in-out infinite}
.sc b{display:block;font-size:26px;font-weight:800;text-shadow:0 2px 6px #000}
.sc small{display:block;font-size:17px;opacity:.95;text-shadow:0 1px 4px #000}
.sc .w{display:block;margin-top:8px;font-size:clamp(30px,4vw,42px);font-weight:900;animation:glow 4s linear infinite;animation-delay:calc(var(--i)*-.8s)}
.sc .ok{font-size:20px;font-weight:800;color:#6dffb4;text-shadow:0 1px 5px #000}
#go{font-size:26px;font-weight:900;padding:16px 38px;background:linear-gradient(135deg,#d6284f,#1f9d62);color:#fff;border:2px solid #fff;animation:pu2 1.6s infinite}
@keyframes pu2{50%{transform:scale(1.07);box-shadow:0 0 30px #ffd24d}}
</style></head><body>
<div class="gar" id="gar"></div>
<div id="sp"></div>
<div class="wrap">
 <h1>🎄 Our Flat ❄️</h1>
 <p class="sub" id="sub">Who does what, today and every day.</p>
 <div class="row" id="me"></div>
 <div class="row" style="margin-top:8px"><button class="chip" id="mu">🎵 Play song</button><button class="chip" id="nb">🔔 Turn on reminders</button><button class="chip" id="ab" style="display:none">🔑 Admin login</button><button class="chip" id="lo" style="display:none">Log out</button></div>
 <div class="adm" id="adm"></div>
 <div class="row" id="mo" style="margin-top:6px"></div>
 <div class="days" id="days"></div>
 <div class="head"><h2 id="dt"></h2><span id="pc" class="sub" style="margin:0"></span></div>
 <div class="bar"><i id="pb"></i></div>
 <div id="list"></div>
 <div class="head" style="margin-top:22px"><h2>🍲 Food ideas</h2><button class="chip" id="rb">🎲 Pick for me</button></div>
 <div class="row" id="foods"></div>
 <div class="head" style="margin-top:22px"><h2>📒 Meals cooked</h2></div><div id="menu"></div><p class="sub" id="pick" style="font-size:18px;margin-top:10px"></p>
 <p class="note" id="note"></p>
</div>
